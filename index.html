<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <title>Calculadora de Gorjeta</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  
  <header>
     <img src="./calculadora-de-gorjeta_base/images/logo.svg" alt="">
  </header>
  
  <section class="informacoes">
    <form action="">
        <div class="conta">
            <label for="conta">conta</label>

         <div>
            <img src="./calculadora-de-gorjeta_base/images/icon-dollar.svg" alt="icon-dollar">
            <input type="number" name="conta" id="conta" placeholder="0">
         </div>
        </div>

        <div class="gorjeta">
         <label for="outra">selecioner a gorjeta %</label>
         <div>
            <input type="button" value="5%"> 
            <input type="button" value="10%">
            <input type="button" value="15%">
            <input type="button" value="25%">
            <input type="button" value="50%">
            <input type="number" name="outra" id="outra" placeholder="Outra">
         </div>
        </div>
        <div class="pessoas">
                 <label for="pessoas">Quantidade de Pessoas</label>
                 <p id="erro">Não pode ser zero</p>
         <div>
            <img src="./calculadora-de-gorjeta_base/images//icon-person.svg" alt="icon-person">
            <input type="number" name="Pessoas" id="Pessoas"placeholder= 0>
         </div>
        </div>
        
    </form>
</section>
  <dection class="resultados">
     <div class="total">
      <p>
        <strong>gorjeta-total</strong> <br>
        / pessoa
      </p>

      <strong>$ 0.00</strong>
     </div>
     <div class="total">
      <p>
        <strong>Toal</strong> <br>
        / pessoa
      </p>

      <strong>$ 0.00</strong>
     </div>
  </dection>
</body>
</html>
